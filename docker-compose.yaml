services:
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    runtime: nvidia
    # Come back after a host reboot (the default policy "no" left Skippy offline after 2026-10-11's reboot).
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Run the container in the user's local timezone. Without this, TZ is unset
      # inside the image and datetime.now().astimezone() resolves to UTC, so the
      # "current time" injected into the agent detection prompt is UTC — making
      # "remind me tomorrow" land a day late when typed in the evening (CDT).
      - TZ=America/Chicago
    volumes:
      - ./models:/app/models
      - ./pipeline:/app
      - ./pipeline/config.yaml:/app/config.yaml:ro
      - ./knowledge:/root/knowledge
      - ~/.personal-ai:/root/.personal-ai
      - ./training:/app/training:ro
      # Give the container the host's timezone data so TZ=America/Chicago above
      # actually resolves (the base image ships no zoneinfo). Read-only.
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "8080:8080"

  # HHEM faithfulness gate (CPU only, no GPU). Off unless the faithfulness_gate setting is on.
  faithfulness:
    build:
      context: .
      dockerfile: docker/faithfulness/Dockerfile
    restart: unless-stopped
    mem_limit: 6g          # HHEM peaks ~2.3 GB; an unbounded run once hit ~90 GB (2026-10-11)
    memswap_limit: 6g
    cpus: 8
    environment:
      - CUDA_VISIBLE_DEVICES=
      # match torch's thread pool to the cpus limit: the default 24 threads on 8 CPUs thrashes
      - OMP_NUM_THREADS=8
    volumes:
      - ./pipeline:/app/pipeline:ro
      - ./eval:/app/eval:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8090:8090"

  vectordb:
    image: chromadb/chroma:0.5.0
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    volumes:
      - ./vectordb:/data
    ports:
      - "8000:8000"

volumes:
  hf-cache:
